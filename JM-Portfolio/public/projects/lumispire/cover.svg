<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Lumispire website preview</title>
  <desc id="desc">Stylized browser preview for the Lumispire corporate website of LTC Group of Companies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8f1"/>
      <stop offset="1" stop-color="#f8fbf8"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c6b3f"/>
      <stop offset="1" stop-color="#18945d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#0d2a1c" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1370" cy="130" r="230" fill="#dcefe4" opacity="0.75"/>
  <circle cx="125" cy="850" r="270" fill="#e3f2e8" opacity="0.8"/>
  <g filter="url(#shadow)">
    <rect x="150" y="100" width="1300" height="800" rx="34" fill="#ffffff"/>
    <rect x="150" y="100" width="1300" height="74" rx="34" fill="#f4f7f5"/>
    <rect x="150" y="140" width="1300" height="34" fill="#f4f7f5"/>
    <circle cx="200" cy="137" r="10" fill="#d3dad6"/>
    <circle cx="232" cy="137" r="10" fill="#d3dad6"/>
    <circle cx="264" cy="137" r="10" fill="#d3dad6"/>
    <rect x="325" y="119" width="760" height="36" rx="18" fill="#ffffff" stroke="#dfe7e2"/>
    <text x="705" y="143" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6c7c72">lumispire.online</text>

    <rect x="150" y="174" width="1300" height="472" fill="url(#hero)"/>
    <text x="240" y="270" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="5" fill="#d9f3e4">LUMISPIRE</text>
    <text x="240" y="365" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" fill="#ffffff">LTC GROUP OF</text>
    <text x="240" y="445" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" fill="#ffffff">COMPANIES</text>
    <text x="240" y="505" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#dcf4e6">A modern corporate presence built for clarity, trust, and growth.</text>
    <rect x="240" y="552" width="190" height="54" rx="27" fill="#ffffff"/>
    <text x="335" y="586" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0c6b3f">EXPLORE</text>

    <circle cx="1195" cy="410" r="165" fill="#ffffff" opacity="0.12"/>
    <circle cx="1195" cy="410" r="118" fill="#ffffff" opacity="0.14"/>
    <circle cx="1195" cy="410" r="74" fill="#ffffff" opacity="0.16"/>
    <text x="1195" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#ffffff">L</text>

    <rect x="150" y="646" width="1300" height="254" fill="#ffffff"/>
    <text x="240" y="730" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#148455">CORPORATE WEBSITE</text>
    <text x="240" y="786" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#163526">Professional. Responsive. Clear.</text>
    <rect x="240" y="828" width="245" height="12" rx="6" fill="#dfe9e3"/>
    <rect x="505" y="828" width="190" height="12" rx="6" fill="#e8eeea"/>
    <rect x="715" y="828" width="310" height="12" rx="6" fill="#dfe9e3"/>
